services:
  postgres:
    container_name: nest-clean-pg
    image: bitnami/postgresql
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nest_clean
    volumes:
      - ./data/pg:/data/postgres

  redis:
    container_name: nest-clean-redis
    image: bitnami/redis
    ports:
      - 6380:6379
    environment:
      REDIS_PASSWORD: redis
    volumes:
      - ./data/redis:/data
